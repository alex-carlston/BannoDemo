# Optional Cloudflare deploy via GitHub Actions.
# Primary path is Docker quickstart (./quickstart.sh) — do not require Actions for demos.
#
# Enable: add repo secret CLOUDFLARE_API_TOKEN (and usually CLOUDFLARE_ACCOUNT_ID),
# then run this workflow manually (Actions → Deploy → Run workflow).
# Leaving CLOUDFLARE_API_TOKEN unset makes the job skip cleanly (no red X on push).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Cloudflare token
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret — skipping CI deploy."
            echo "Use ./quickstart.sh locally, or add the secret and re-run this workflow."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deploy toolbox image
        if: steps.cf.outputs.has_token == 'true'
        run: docker build -t banno-pulse-deploy .

      - name: Deploy Worker + D1 migrations
        if: steps.cf.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          docker run --rm \
            -e CLOUDFLARE_API_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID \
            banno-pulse-deploy

      - name: Skipped notice
        if: steps.cf.outputs.has_token != 'true'
        run: |
          echo "CI deploy skipped (optional). Docker quickstart remains the supported path."
